<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CLUBHUS crest">
  <defs>
    <path id="crest-top" d="M100,100 m-74,0 a74,74 0 1,1 148,0" fill="none"/>
    <path id="crest-bottom" d="M100,100 m74,0 a74,74 0 1,1 -148,0" fill="none"/>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="0.75"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="currentColor" stroke-width="1"/>

  <text font-family="'Fraunces', Georgia, serif" font-size="13" letter-spacing="5" fill="currentColor" text-anchor="middle">
    <textPath href="#crest-top" startOffset="50%">CLUBHUS</textPath>
  </text>
  <text font-family="'Inter', sans-serif" font-size="7.5" letter-spacing="4" fill="currentColor" text-anchor="middle">
    <textPath href="#crest-bottom" startOffset="50%">EST · MMXXVI · DANMARK</textPath>
  </text>

  <!-- clubhouse mark -->
  <g transform="translate(64,62) scale(1.5)" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7,23 L24,8 L41,23"/>
    <path d="M11,23 L11,40 L37,40 L37,23"/>
    <path d="M20,40 L20,31 a4,4 0 0 1 8,0 L28,40"/>
    <path d="M24,8 L24,3"/>
    <path d="M24,4 C28,4 31,6 34,6 C31,8 28,9 24,9 Z" fill="currentColor" stroke="none"/>
  </g>

  <!-- small stars -->
  <g fill="currentColor">
    <circle cx="38" cy="100" r="1.6"/>
    <circle cx="162" cy="100" r="1.6"/>
  </g>
</svg>
