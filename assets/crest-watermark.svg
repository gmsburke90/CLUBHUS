<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 264" role="img" aria-label="CLUBHUS regal crest" fill="none" stroke="#0B3D2E" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- a single barley ear, base at origin, tip toward -y -->
    <g id="ear">
      <path d="M0,0 L0,-40"/>
      <path d="M0,-40 L-5,-50"/><path d="M0,-40 L0,-54"/><path d="M0,-40 L5,-50"/>
      <path d="M0,-10 l-6,-5"/><path d="M0,-10 l6,-5"/>
      <path d="M0,-17 l-6,-5"/><path d="M0,-17 l6,-5"/>
      <path d="M0,-24 l-6,-5"/><path d="M0,-24 l6,-5"/>
      <path d="M0,-31 l-6,-5"/><path d="M0,-31 l6,-5"/>
    </g>
  </defs>

  <!-- crown -->
  <g stroke-width="2">
    <path d="M88,46 L94,22 L102,40 L110,16 L118,40 L126,22 L132,46"/>
    <path d="M86,46 L134,46"/>
    <path d="M86,54 L134,54"/>
    <path d="M86,46 L86,54"/><path d="M134,46 L134,54"/>
    <path d="M110,16 L110,9"/><path d="M107,12 L113,12"/>
  </g>
  <g fill="#0B3D2E" stroke="none">
    <circle cx="94" cy="22" r="2.6"/>
    <circle cx="110" cy="16" r="3"/>
    <circle cx="126" cy="22" r="2.6"/>
    <circle cx="98" cy="50" r="1.6"/>
    <circle cx="110" cy="50" r="1.6"/>
    <circle cx="122" cy="50" r="1.6"/>
  </g>

  <!-- shield -->
  <g stroke-width="2">
    <path d="M48,62 L172,62 L172,138 C172,176 142,198 110,214 C78,198 48,176 48,138 Z"/>
    <path d="M56,70 L164,70 L164,138 C164,170 138,189 110,202 C82,189 56,170 56,138 Z" stroke-width="1"/>
  </g>

  <!-- per-fess divider with diamond -->
  <g stroke-width="1.25">
    <path d="M56,120 L102,120"/><path d="M118,120 L164,120"/>
    <path d="M110,114 L116,120 L110,126 L104,120 Z"/>
  </g>

  <!-- clubhouse mark (upper field) -->
  <g transform="translate(90.8,72) scale(0.82)" stroke-width="2.6">
    <path d="M7,23 L24,8 L41,23"/>
    <path d="M11,23 L11,40 L37,40 L37,23"/>
    <path d="M20,40 L20,31 a4,4 0 0 1 8,0 L28,40"/>
    <path d="M24,8 L24,3"/>
    <path d="M24,4 C28,4 31,6 34,6 C31,8 28,9 24,9 Z" fill="#0B3D2E" stroke="none"/>
  </g>

  <!-- crossed barley + star (lower field) -->
  <g stroke-width="1.3" opacity="0.95">
    <use href="#ear" transform="translate(110,190) rotate(-21) scale(0.7)"/>
    <use href="#ear" transform="translate(110,190) rotate(21) scale(0.7)"/>
  </g>
  <path fill="#0B3D2E" stroke="none"
    d="M110,135 L112.5,142.5 L120.5,142.6 L114.1,147.3 L116.5,154.9 L110,150.3 L103.5,154.9 L105.9,147.3 L99.5,142.6 L107.5,142.5 Z"/>

  <!-- motto banner -->
  <g stroke-width="1.4">
    <path d="M58,216 C90,208 130,208 162,216 L162,232 C130,240 90,240 58,232 Z"/>
    <path d="M58,216 L44,211 L50,224 L44,236 L58,231"/>
    <path d="M162,216 L176,211 L170,224 L176,236 L162,231"/>
  </g>
  <text x="110" y="228" font-family="'Fraunces', Georgia, serif" font-size="13" letter-spacing="3.5"
    fill="#0B3D2E" stroke="none" text-anchor="middle">CLUBHUS</text>
  <text x="110" y="254" font-family="'Inter', sans-serif" font-size="7" letter-spacing="3.5"
    fill="#0B3D2E" stroke="none" text-anchor="middle" opacity="0.85">EST · MMXXVI · DANMARK</text>
</svg>
